<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimTec Catalog Assistant</title>
  <link rel="stylesheet" href="bot.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="kicker">TimTec LLC</p>
        <h1>Product assistant</h1>
        <p class="lede">Search by TimTec ID, IUPAC name, or SMILES. CoA and SDS files are issued by the live document tools.</p>
      </div>
      <nav class="tools" aria-label="TimTec document tools">
        <a href="https://structure.timtec.org/coa" target="_blank" rel="noopener noreferrer">CoA</a>
        <a href="https://structure.timtec.org/msds" target="_blank" rel="noopener noreferrer">SDS</a>
        <a href="https://structure.timtec.org/search" target="_blank" rel="noopener noreferrer">List search</a>
      </nav>
    </header>

    <div id="chat-box" class="chat" aria-live="polite">
      <div class="row bot">
        <div class="bubble">Loading the TimTec catalog…</div>
      </div>
    </div>

    <form id="composer" class="composer">
      <label class="sr-only" for="query">Product search</label>
      <input id="query" name="query" type="search" placeholder="TimTec ID, IUPAC, or SMILES" autocomplete="off" disabled>
      <button id="search" type="submit" disabled>Search</button>
    </form>

    <address id="contact" class="contact"></address>
  </div>
  <script src="catalog.js"></script>
  <script src="bot.js"></script>
</body>
</html>
